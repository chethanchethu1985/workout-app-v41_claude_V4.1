name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Excel library
        run: cp node_modules/xlsx/dist/xlsx.full.min.js www/xlsx.full.min.js

      - name: Create the Android project
        run: npx cap add android

      - name: Set app version 4.1.0
        run: sed -i 's/versionCode 1/versionCode 5/; s/versionName "1.0"/versionName "4.1.0"/' android/app/build.gradle

      - name: Black launch screen (best effort)
        run: |
          STY=android/app/src/main/res/values/styles.xml
          if [ -f "$STY" ]; then
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="splash_black">#000000</color>\n</resources>\n' > android/app/src/main/res/values/splash_colors.xml
            sed -i 's#@drawable/splash#@color/splash_black#g' "$STY"
          fi

      - name: Add custom code and permissions
        run: |
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          DIR=android/app/src/main/java/$(echo "$APP_ID" | tr . /)
          mkdir -p "$DIR"
          cp android-overrides/*.java "$DIR/"
          sed -i "s/APP_PACKAGE/$APP_ID/" "$DIR"/*.java
          python3 patch_manifest.py

      - name: Copy the app files into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Workouts-V4.1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
